<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css" integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <title>Issa Travel Recommendation</title>
</head>
<body>
    <nav class='navbar'>
        <div class="agence">
            <img id='logo' src="https://img.freepik.com/premium-photo/full-shot-travel-concept-with-landmarks_1174912-76.jpg?w=2000" alt="travel-img">
            <p>Issa-Travel</p>
        </div>
        <div class='links'>
            <a href="./travel_recommendation.html">Home</a>
            <a href="./about.html">About Us</a>
            <a href="/">Contact Us</a>
        </div>
    </nav>
    <div class='hero'>
        <div class='socialMedia'>
            <i class="fa-brands fa-twitter"></i>
            <i class="fa-brands fa-facebook-f"></i>
            <i class="fa-brands fa-instagram"></i>
            <i class="fa-brands fa-youtube"></i>
        </div>
        <div class='contact-info'>
            <div id='desc-contact'>
                <h1>contact us</h1>
                <p>Get in touch</p>
            </div>
            <div class='form-div' id='formContact'>
                <form>
                <label for="name">Name</label>
                <input type="text" placeholder='Ente your name' id='nameContact'>
                <label for="email">Email</label>
                <input type="email" id='emailConctact' placeholder='Enter your email'>
                <label for="message">Message</label>
                <textarea name="message" id="message" cols="30" rows="10" placeholder='Enter your message'></textarea>
                <button>Submit</button>
            </form>
        </div>
    </div>
    </div>
    <script src="./travel_recommendation.js"></script>

</html>
